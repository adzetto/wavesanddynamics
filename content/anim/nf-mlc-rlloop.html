    if (ylabel) math(ylabel, x - (o.ylabelGap || 48), y + h / 2, { size: labelSize, align: 'center', rot: -Math.PI / 2, alpha: a });
  }
  const inside = f => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); f(); ctx.restore(); };
  return { X, Y, inside };
}
function fmt(v) {
  if (Math.abs(v) < 1e-12) return '0';
  const s = Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toPrecision(3));
  return s.replace('-', '−');
}

/* ---------------------------------------------------------------- colour
   diverging(v), v in [-1, 1]: navy, white, the warm accent, for a signed
   field (displacement, pressure). seq(v), v in [0, 1]: white to navy. The
   LUTs, 256 entries of r, g, b, colour an ImageData without a call per pixel. */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function _ramp(stops) {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(u)), s = u - k;

/* blue and crimson arms matched stop for stop in CIELAB lightness (19, 43, 75),

const DIVERGING = _ramp(['#043052', '#2E6A9E', '#9CBBD6', '#FFFFFF', '#DEABAB', '#B03F4D', '#651020'].map(_hex));
const SEQ = _ramp(['#FFFFFF', '#C9D7E4', '#5B8DB8', '#095A94', '#043052'].map(_hex));
function _lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
const diverging = v => _lutc(DIVERGING, (v + 1) / 2);
const seq = v => _lutc(SEQ, v);

/* ---------------------------------------------------------------- controls
   uiChip(x, y, w, h, label, state, alpha): a control drawn in the figure, as
   Figure 18b's chips are: white with a grey edge; the one chosen navy with
   white type; under the pointer steel with a navy edge; pressed steel2; off
   (unavailable) pale. Its edge is a line(), which the overlap check sees.
   state: {on, hover, down, off, size}; size is the label's (15 unless set).
   Keep its hit area at least 24 CSS px. */
function uiChip(x, y, w, h, label, st = {}, a = 1) {
  if (st.off) st = { off: true, size: st.size };                    // unavailable: no hover, no press
  const fill = st.on ? C.navy : st.down ? C.steel2 : st.hover ? C.steel : '#fff';
  const edge = st.off ? C.rule : st.on || st.hover || st.down ? C.navy : C.guide;
  line([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], { color: edge, width: 1, fill, close: true, alpha: a });
  const sz = st.size || 15;
  text(label, x + w / 2, y + h / 2 + sz / 3, { size: sz, align: 'center', alpha: a,
    color: st.on ? '#fff' : st.off ? C.guide : st.hover ? C.ink : C.body });
}

/* ---------------------------------------------------------------- data
   b64f32(s): a Float32Array from base64, for arrays too long for JSON. */
function b64f32(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); }
function b64i8(s) { const b = atob(s), u = new Int8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = (b.charCodeAt(i) << 24) >> 24; return u; }

/* ---- mlc shared: shapes, labels, numbers (tools/numfig/mlc_lib.py) ---- */
const MINUS = '−';
function nf(v, d = 2) { const s = (Math.abs(v) < .5 * Math.pow(10, -d) ? 0 : v).toFixed(d); return s.replace('-', MINUS); }
function pct(v) { return Math.round(v * 100) + '%'; }
/* a TikZ rectangle: outline drawing itself with `progress`, fill fading in behind it */
function box(x, y, w, h, o = {}) {
  const { fill = null, stroke = C.ink, width = 1.3, alpha = 1, progress = 1, dash = null, fillAlpha = 1 } = o;
  if (progress <= 0 || alpha <= 0) return;
  if (fill) { ctx.save(); ctx.globalAlpha *= alpha * fillAlpha * clamp(progress * 1.6 - .3); ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); ctx.restore(); }
  if (stroke) line([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]], { color: stroke, width, alpha, progress, dash });
}
/* a label that arrives: fades in and settles 6 units into place on Motion's spring */
function lab(s, x, y, t0, o = {}) {
  const a = settle(t0, o.visual || .28); if (a <= 0) return 0;
  return text(s, x, y + (o.rise === undefined ? 6 : o.rise) * (1 - a), { size: 16, ...o, alpha: (o.alpha === undefined ? 1 : o.alpha) * a });
}
function mlab(s, x, y, t0, o = {}) {
  const a = settle(t0, o.visual || .28); if (a <= 0) return 0;
  return math(s, x, y + (o.rise === undefined ? 6 : o.rise) * (1 - a), { size: 16, ...o, alpha: (o.alpha === undefined ? 1 : o.alpha) * a });
}
/* panel letter and a short subtitle in the body colour */
function sub(letter, x, y, words, a, o = {}) {
  if (a <= 0) return;
  panel(letter, x, y, { alpha: a });
  if (words) text(words, x + (o.gap || 35), y, { size: 17, color: C.body, alpha: a });
}
/* points of a quadratic Bezier from p0 to p2 bending through control p1 */
function bez(p0, p1, p2, n = 40) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u;
    pts.push([v * v * p0[0] + 2 * v * u * p1[0] + u * u * p2[0], v * v * p0[1] + 2 * v * u * p1[1] + u * u * p2[1]]); }
  return pts;
}
/* a curved arrow along a polyline, the stealth tip at the end once the stroke arrives */
function carrow(pts, o = {}) {
  const { color = C.ink, width = 1.5, head = 10, progress = 1, alpha = 1, dash = null } = o;
  if (progress <= 0) return;
  let L = 0; const d = [];
  for (let i = 1; i < pts.length; i++) { d.push(Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); L += d[d.length - 1]; }
  // stop the shaft short of the tip so the tip covers it
  let keep = L * progress - (progress >= 1 ? head * .55 : 0), out = [pts[0]];
  for (let i = 1; i < pts.length && keep > 0; i++) {
    const s = Math.min(1, keep / d[i - 1]);
    out.push([lerp(pts[i - 1][0], pts[i][0], s), lerp(pts[i - 1][1], pts[i][1], s)]); keep -= d[i - 1];
  }
  line(out, { color, width, alpha, dash });
  if (progress >= .98) {
    const q = pts[pts.length - 1], p = pts[pts.length - 2];
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    arrow(q[0] - Math.cos(a) * 2, q[1] - Math.sin(a) * 2, q[0], q[1], { color, width, head, alpha: alpha * clamp((progress - .98) * 50) });
  }
}
/* a colour for v through a LUT (engine's SEQ or DIVERGING), u in [0, 1] */
function lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
/* a LUT entry dark enough for white text: WCAG relative luminance under
   .213, where white and ink have the same contrast on it */
function lutDark(lut, u) {
  const i = Math.round(clamp(u) * 255) * 3, lin = c => (c /= 255) <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  return .2126 * lin(lut[i]) + .7152 * lin(lut[i + 1]) + .0722 * lin(lut[i + 2]) < .213;
}
/* signed values (weights, activations, vector entries): positive blue,
   negative crimson, matched in lightness, the engine's DIVERGING read from its
   other end; the same in mlb_common.py, so every figure of the guide agrees */
const SIGNED = (() => { const L = new Uint8ClampedArray(768); for (let i = 0; i < 256; i++) for (let c = 0; c < 3; c++) L[i * 3 + c] = DIVERGING[(255 - i) * 3 + c]; return L; })();
const signed = v => { const i = Math.round((clamp(v, -1, 1) + 1) / 2 * 255) * 3; return '#' + [0, 1, 2].map(c => SIGNED[i + c].toString(16).padStart(2, '0')).join(''); };
const S_POS = C.blue, S_NEG = C.accent;
/* a horizontal colour bar with ticks below and a label to its left */
function cbar(x, y, w, h, lut, lo, hi, ticks, label, a = 1, fmtv = v => nf(v, 1)) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  for (let i = 0; i < w; i++) { ctx.fillStyle = lutc(lut, i / (w - 1)); ctx.fillRect(x + i, y, 1.5, h); }
  ctx.restore();
  box(x, y, w, h, { width: 1, alpha: a });
  for (const v of ticks) {
    const xx = x + (v - lo) / (hi - lo) * w;
    line([[xx, y + h], [xx, y + h + 4]], { width: 1, alpha: a });
    text(fmtv(v), xx, y + h + 19, { size: 15, align: 'center', alpha: a });
  }
  if (label) math(label, x - 12, y + h - 1, { size: 16, align: 'right', alpha: a });
}
/* colour mixing between two #rrggbb */
function mix(c1, c2, s) {
  const a = _hex(c1), b = _hex(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], s))},${Math.round(lerp(a[1], b[1], s))},${Math.round(lerp(a[2], b[2], s))})`;
}
/* a word in a box, as a token: serif 17, centred */
function token(s, cx, cy, o = {}) {
  const { w = 0, h = 34, size = 17, alpha = 1, stroke = C.ink, fill = '#fff', color = C.ink, width = 1.3, progress = 1 } = o;
  ctx.save(); ctx.font = font({ size }); const tw = ctx.measureText(s).width; ctx.restore();
  const bw = w || tw + 22;
  box(cx - bw / 2, cy - h / 2, bw, h, { fill, stroke, width, alpha, progress });
  if (progress > .3) text(s, cx, cy + size * .34, { size, align: 'center', color, alpha: alpha * clamp(progress * 1.5 - .3) });
  return bw;
}

const L0 = 0.6, P = 4.8, HOLD = 3.2, SEAM = 0.6, A0 = 0.6, A1 = 1.7, M1 = 2.4, R1 = 3.5, U1 = 4.4, NT = 3;
const ST = DATA.steps, NST = ST.length, FIRST = NST - NT, LOOP = NT * P + HOLD;   // a lap: the last NT turns
const POSTER_T = L0 + NT * P + 1.2;                   // after the last step: +1, the goal, the policy after
const AG = { x: 60, y: 36, w: 320, h: 250 }, EN = { x: 620, y: 36, w: 320, h: 250 };
const CS = 36, GX0 = EN.x + (EN.w - 5 * CS) / 2 + 10, GY0 = EN.y + 48;
const YA = 104, YR = 224;                             // the action arrow, the reward and state arrow
const MOVE = [[0, 1], [0, -1], [-1, 0], [1, 0]], WORD = ['up', 'down', 'left', 'right'];
const gx = p => GX0 + (p[0] + .5) * CS, gy = p => GY0 + (4 - p[1] + .5) * CS;
/* the turn i under way, u seconds into it; `out` fades the lap's walk as it ends */
function clockNow() {
  if (t < L0) return { i: FIRST, u: -1, lap: 0, out: 1 };
  const T = t - L0, lap = Math.floor(T / LOOP), r = T - lap * LOOP;
  const n = Math.min(NT - 1, Math.floor(r / P));
  return { i: FIRST + n, u: r - n * P, lap, out: 1 - clamp((r - (LOOP - SEAM)) / SEAM) };
}
const ph = (u, a, b) => clamp((u - a) / (b - a));
const WIN = [[A0, A1], [M1, R1], [R1, U1]];           // when the action, the reward, the update travel
/* the policy bars: four actions, their probabilities in the observed state;
   the action just chosen dark (hi), the previous turn's letting go (was, lo) */
function bars(pi, chosen, hi, a0, was = -1, lo = 0) {
  const base = AG.y + 212, Hm = 104, bw = 34;
  line([[AG.x + 44, base], [AG.x + AG.w - 24, base]], { width: 1.2, alpha: a0 });
  for (let k = 0; k < 4; k++) {
    const cx = AG.x + 82 + k * 64, h = Hm * pi[k];
    const on = Math.max(k === chosen ? hi : 0, k === was ? lo : 0);
    box(cx - bw / 2, base - h, bw, h, { fill: on > 0 ? mix('#A9C3DA', '#043052', on) : C.mist, stroke: C.blue, width: 1.2, alpha: a0 });
    text(nf(pi[k], 3), cx, base - h - 7, { size: 14, align: 'center', alpha: a0 });
    const d = MOVE[k], L = 9;
    arrow(cx - d[0] * L, base + 21 + d[1] * L, cx + d[0] * L, base + 21 - d[1] * L, { width: 1.5, head: 8, alpha: a0 });
  }
}
/* a small tag that travels along an arrow: a word or a number in a white box */
function tag(s, x, y, o = {}) {
  const { color = C.ink, alpha = 1, isMath = false } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.font = font({ size: 15 }); const w = (isMath ? math(s, 0, -1e4, { size: 15, alpha: 0 }) : ctx.measureText(s).width) + 14; ctx.restore();
  box(x - w / 2, y - 12, w, 24, { fill: '#fff', stroke: color, width: 1.2, alpha });
  if (isMath) math(s, x, y + 5, { size: 15, align: 'center', color, alpha }); else text(s, x, y + 5, { size: 15, align: 'center', color, alpha });
}
function draw() {
  const { i, u, lap, out } = clockNow(), st = ST[i], prev = i > FIRST ? ST[i - 1] : null;
  const live = u >= 0;
  // which part of the loop is working now: its label darkens from the body colour to ink
  const on = k => !live ? 0 : Math.sin(Math.PI * ph(u, WIN[k][0], WIN[k][1]));
  const ink = k => mix('#544F48', '#27221C', on(k));
  // ---- the two boxes, the two arrows, the update loop
  box(AG.x, AG.y, AG.w, AG.h, { fill: C.steel, width: 1.6, progress: seg(0, .42) });
  box(EN.x, EN.y, EN.w, EN.h, { fill: C.steel, width: 1.6, progress: seg(.06, .42) });
  lab('agent', AG.x + 18, AG.y + 30, .25, { size: 17 });
  lab('environment', EN.x + 18, EN.y + 30, .3, { size: 17 });
  carrow([[AG.x + AG.w, YA], [EN.x, YA]], { width: 1.6, progress: seg(.28, .35) });
  carrow([[EN.x, YR], [AG.x + AG.w, YR]], { width: 1.6, progress: seg(.34, .35) });
  mlab('\\rm{action}\\ \\ A_{t}', 500, YA - 22, .45, { size: 17, align: 'center', color: ink(0) });
  mlab('\\rm{reward}\\ \\ R_{t+1},\\ \\ \\rm{new\\ state}\\ \\ S_{t+1}', 500, YR + 44, .5, { size: 17, align: 'center', color: ink(1) });
  const loop = bez([AG.x + 120, AG.y + AG.h], [AG.x + 170, AG.y + AG.h + 96], [AG.x + 220, AG.y + AG.h]);
  carrow(loop, { width: 1.5, progress: seg(.4, .35) });
  lab('policy update', AG.x + 234, AG.y + AG.h + 42, .55, { size: 17, color: ink(2) });
  // ---- the step
  const a0 = seg(.35, .3);
  if (live) mlab(`t = ${i}`, 500, (YA + YR) / 2 + 6, L0, { size: 17, align: 'center' });
  // the policy in the observed state: settles in, then the update moves it
  let pi = st.pb;
  const before = prev || (lap > 0 ? ST[NST - 1] : null);   // the turn that came before, if any
  if (live) {
    const from = before ? before.pa : st.pb, s0 = settle(t - u, .45);
    pi = st.pb.map((v, k) => lerp(from[k], v, s0));
    const up = u >= R1 ? settle(t - u + R1, .55) : 0;   // its numbers final as the loop's dot arrives
    if (up > 0) pi = st.pb.map((v, k) => lerp(v, st.pa[k], up));
  }
  bars(pi, st.a, live ? clamp((u - A0) / .4) : 0, a0, before ? before.a : -1, live ? 1 - clamp(u / .3) : 0);
  const sOb = st.s;
  mlab(`\\pi(a\\,|\\,s),\\ \\ s = (${sOb[0]},\\,${sOb[1]})`, AG.x + 18, AG.y + 62, .4, { size: 16, color: C.body });
  // ---- the grid world, the agent walking its first episode
  const ga = seg(.2, .4);
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
    const X = GX0 + x * CS, Y = GY0 + (4 - y) * CS;
    box(X, Y, CS, CS, { fill: x === 4 && y === 4 ? C.accent : '#fff', stroke: C.rule, width: 1, alpha: ga });
  }
  box(GX0, GY0, 5 * CS, 5 * CS, { width: 1.3, progress: ga });
  lab('goal', GX0 + 4.5 * CS, GY0 - 8, .45, { size: 14, color: C.accent, align: 'center' });
  lab('start', GX0 + .5 * CS, GY0 + 5 * CS + 17, .45, { size: 14, color: C.body, align: 'center' });
  const trail = [[gx(ST[0].s), gy(ST[0].s)]];
  for (let k = 0; k < i; k++) trail.push([gx(ST[k].s2), gy(ST[k].s2)]);
  let ax = gx(st.s), ay = gy(st.s);
  if (live) {
    const e = easeInOut(ph(u, A1, M1));
    if (st.s[0] === st.s2[0] && st.s[1] === st.s2[1]) { const b = Math.sin(Math.PI * e) * 9; ax += MOVE[st.a][0] * b; ay -= MOVE[st.a][1] * b; }
    else { ax = lerp(ax, gx(st.s2), e); ay = lerp(ay, gy(st.s2), e); if (e > 0) trail.push([ax, ay]); }
  }
  // a new lap: the agent and its path so far fade in again, as the lap before them faded
  const back0 = live && lap > 0 && i === FIRST ? clamp(u / .4) : 1;
  line(trail, { color: C.sky, width: 2, alpha: .7 * ga * out * back0 });
  dot(ax, ay, 7, { color: '#fff', fill: C.navy, width: 2, alpha: ga * out * back0 });
  // ---- what travels round the loop: the action out, the reward and the new state back
  if (live) {
    const x0 = AG.x + AG.w + 90, x1 = EN.x - 80;
    const go = ph(u, A0, A1);
    if (u >= A0) tag(WORD[st.a], lerp(x0, x1, easeInOut(go)), YA, { alpha: clamp(go * 5) * out });
    else if (prev) tag(WORD[prev.a], x1, YA, { alpha: 1 - clamp(u / .3) });
    const back = ph(u, M1, R1);
    const two = (s_, alpha, pos) => {
      const x = lerp(x1, x0, pos);
      tag(s_.r > 0 ? '+1' : nf(s_.r, 2), x + 36, YR, { alpha, color: s_.r > 0 ? C.accent : C.ink });
      tag(`(${s_.s2[0]},\\,${s_.s2[1]})`, x - 44, YR, { alpha, isMath: true });
    };
    if (u >= M1) two(st, clamp(back * 5) * out, easeInOut(back));
    else if (prev) two(prev, 1 - clamp(u / .3), 1);
    // the update: a dot running round the loop, along it between its points
    const upd = ph(u, R1, U1);
    if (upd > 0 && upd < 1) { const q = easeInOut(upd) * (loop.length - 1), k = Math.min(loop.length - 2, Math.floor(q)), f = q - k;
      dot(lerp(loop[k][0], loop[k + 1][0], f), lerp(loop[k][1], loop[k + 1][1], f), 4.5, { color: C.navy, fill: C.navy, alpha: Math.sin(Math.PI * upd) }); }
  }
  text('the grid world of Figure 30, the end of its first episode: reward +1 at the goal, −0.02 per step, ε = 0.5',
       20, H - 14, { size: 14, color: C.muted, alpha: seg(.6, .5) });
}
boot();
