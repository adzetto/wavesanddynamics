    math(`${n + 1}^{\\rm{${ORD[n]}}}`, cx, yg + 40, { size: 15, align: 'center', color: hot ? C.accent : C.ink, alpha: a });
    text('resonance mode', cx, yg + 58, { size: 14, align: 'center', color: hot ? C.accent : C.body, alpha: a });
    math(`${DATA.fn[n].toFixed(1)}\\,\\rm{Hz}`, cx, yg + 78, { size: 14, align: 'center', color: C.muted, alpha: a });
  }
  const pa = lab(.9);
  text('steel bar 40 × 10 mm, L = 1 m, E = 210 GPa, ρ = 7850 kg/m³, loss factor η = 0.05, force at x = 0.13 L',
       18, H - 32, { size: 14, color: C.muted, alpha: pa });
  const mw = math('w_{\\infty}', 18, H - 12, { size: 14, color: C.muted, alpha: pa });
  text(': the same force on an infinite beam; the page sweeps f and rests at each resonance, each frame the steady state', 18 + mw, H - 12, { size: 14, color: C.muted, alpha: pa });
  text(`time slowed ${SLOW} ×`, W - 18, H - 12, { size: 14, color: C.muted, align: 'right', alpha: pa });
}
boot();
</script>
