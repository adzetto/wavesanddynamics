.fig canvas{display:block;width:100%;height:auto;cursor:pointer;}

.fig:hover .ctl,.ctl:focus-within{opacity:1;}

.ctl button{position:relative;box-sizing:border-box;width:28px;height:28px;padding:0;border-radius:50%;border:1px solid #8A857C;

.ctl button svg{width:15px;height:15px;fill:currentColor;}
.ctl #rs svg{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;}
@media (hover:hover){.ctl button:hover{background:#F6F3EF;}}
.ctl button:active{background:#D7D2CA;}
.ctl button:focus-visible{outline:2px solid #043052;outline-offset:2px;}
/* small frames: never under 24 px (WCAG 2.5.8) */@media (max-width:480px){.ctl{right:4px;bottom:4px;}.ctl button{width:24px;height:24px;}.ctl button svg{width:13px;height:13px;}}

  ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, o = {}) {
  const { color = C.ink, width = 1.6, head = 10, alpha = 1, both = false, dash = null } = o;
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
  if (dash) ctx.setLineDash(dash);
  _seg([[x1, y1], [x2, y2]], color, width);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .6, y2 - Math.sin(a) * head * .6); ctx.stroke();
  ctx.setLineDash([]);
  const tip = (x, y, a) => {       // a TikZ stealth tip
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x - head * Math.cos(a - .38), y - head * Math.sin(a - .38));
    ctx.lineTo(x - head * .62 * Math.cos(a), y - head * .62 * Math.sin(a));
    ctx.lineTo(x - head * Math.cos(a + .38), y - head * Math.sin(a + .38)); ctx.closePath(); ctx.fill();
  };
  tip(x2, y2, a); if (both) tip(x1, y1, a + Math.PI);
  ctx.restore();
}
function dot(x, y, r = 4, o = {}) {
  const { color = C.ink, fill = color, width = 1.4, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); ctx.restore();
}
/* a pin support under (x, y): a triangle on a hatched ground, as TikZ draws it */
function pin(x, y, o = {}) {
  const { s = 16, color = C.ink, alpha = 1, roller = false } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * .7, y + s); ctx.lineTo(x + s * .7, y + s); ctx.closePath(); ctx.fill(); ctx.stroke();
  let g = y + s;
  if (roller) { for (const dx of [-s * .4, s * .4]) { ctx.beginPath(); ctx.arc(x + dx, g + 3, 3, 0, 2 * Math.PI); ctx.stroke(); } g += 6; }
  ctx.beginPath(); ctx.moveTo(x - s, g); ctx.lineTo(x + s, g); ctx.stroke();
  ctx.lineWidth = 1; for (let k = -s; k < s; k += 4.5) { ctx.beginPath(); ctx.moveTo(x + k + 4, g); ctx.lineTo(x + k, g + 5); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.restore();
}
/* a fixed (clamped) end at x, facing dir = +1 (wall on the left) or -1 */
function fixedEnd(x, y, o = {}) {
  const { h = 30, dir = 1, color = C.ink, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2); ctx.stroke(); ctx.lineWidth = 1;
  for (let k = -h / 2; k < h / 2; k += 4.5) { ctx.beginPath(); ctx.moveTo(x, y + k + 4); ctx.lineTo(x - dir * 5, y + k); ctx.stroke(); }
  ctx.restore();
}
/* a dimension line |<- label ->| between x1 and x2 at height y */
function dim(x1, x2, y, label, o = {}) {
  const { color = C.ink, alpha = 1, size = 17 } = o;
  arrow(x1, y, x2, y, { color, width: 1.1, head: 7, both: true, alpha });
  line([[x1, y - 6], [x1, y + 6]], { color, width: 1, alpha }); line([[x2, y - 6], [x2, y + 6]], { color, width: 1, alpha });
  if (label) {
    ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font({ size }); ctx.restore();
    const w = math(label, 0, -1e4, { size, alpha: 0 });
    // the knockout covers the label's whole ink, superscripts to subscripts and the
    // slash's tail (baseline y + .34 size; ink from .95 size above it to .45 below)
    ctx.save(); ctx.fillStyle = '#fff'; ctx.globalAlpha *= alpha; ctx.fillRect((x1 + x2) / 2 - w / 2 - 4, y - size * .62, w + 8, size * 1.42); ctx.restore();
    math(label, (x1 + x2) / 2, y + size * .34, { size, align: 'center', color, alpha });
  }
}

/* ---------------------------------------------------------------- axes
   axes(o) draws a pgfplots axis: a full box, ticks pointing in, numeric
   tick labels, labels in math, and returns {X, Y, inside} to map data to
   the canvas. o = {x, y, w, h, xlim, ylim, xticks, yticks, xlabel, ylabel,
   xfmt, yfmt, grid, progress, alpha, ylog}. */
function axes(o) {
  const { x, y, w, h, xlim, ylim, xticks = [], yticks = [], xlabel = '', ylabel = '',
          xfmt = v => fmt(v), yfmt = v => fmt(v), grid = false, progress = 1, alpha = 1,
          box = true, tickSize = 15, labelSize = 17 } = o;
  const X = v => x + (v - xlim[0]) / (xlim[1] - xlim[0]) * w;
  const Y = v => y + h - (v - ylim[0]) / (ylim[1] - ylim[0]) * h;
  if (progress > 0) {
    const a = alpha * clamp(progress * 1.4);
    if (grid) {
      for (const v of xticks) line([[X(v), y], [X(v), y + h]], { color: C.grid, width: 1, alpha: a });
      for (const v of yticks) line([[x, Y(v)], [x + w, Y(v)]], { color: C.grid, width: 1, alpha: a });
    }
    const frame = box ? [[x, y + h], [x + w, y + h], [x + w, y], [x, y], [x, y + h]] : null;
    if (box) line(frame, { color: C.ink, width: 1.3, progress, alpha });
    else { line([[x, y + h], [x + w, y + h]], { color: C.ink, width: 1.3, progress, alpha }); line([[x, y + h], [x, y]], { color: C.ink, width: 1.3, progress, alpha }); }
    for (const v of xticks) {
      line([[X(v), y + h], [X(v), y + h - 5]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[X(v), y], [X(v), y + 5]], { color: C.ink, width: 1.1, alpha: a });
      math(xfmt(v), X(v), y + h + tickSize + 6, { size: tickSize, align: 'center', alpha: a });
    }
    for (const v of yticks) {
      line([[x, Y(v)], [x + 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[x + w, Y(v)], [x + w - 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      math(yfmt(v), x - 8, Y(v) + tickSize * .35, { size: tickSize, align: 'right', alpha: a });
    }
    if (xlabel) math(xlabel, x + w / 2, y + h + tickSize + labelSize + 16, { size: labelSize, align: 'center', alpha: a });
    if (ylabel) math(ylabel, x - (o.ylabelGap || 48), y + h / 2, { size: labelSize, align: 'center', rot: -Math.PI / 2, alpha: a });
  }
  const inside = f => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); f(); ctx.restore(); };
  return { X, Y, inside };
}
function fmt(v) {
  if (Math.abs(v) < 1e-12) return '0';
  const s = Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toPrecision(3));
  return s.replace('-', '−');
}

/* ---------------------------------------------------------------- colour
   diverging(v), v in [-1, 1]: navy, white, the warm accent, for a signed
   field (displacement, pressure). seq(v), v in [0, 1]: white to navy. The
   LUTs, 256 entries of r, g, b, colour an ImageData without a call per pixel. */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function _ramp(stops) {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(u)), s = u - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(lerp(stops[k][c], stops[k + 1][c], s));
  }
  return lut;
}
/* blue and crimson arms matched stop for stop in CIELAB lightness (19, 43, 75),
   so a value and its negative weigh the same */
const DIVERGING = _ramp(['#043052', '#2E6A9E', '#9CBBD6', '#FFFFFF', '#DEABAB', '#B03F4D', '#651020'].map(_hex));
const SEQ = _ramp(['#FFFFFF', '#C9D7E4', '#5B8DB8', '#095A94', '#043052'].map(_hex));
function _lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
const diverging = v => _lutc(DIVERGING, (v + 1) / 2);
const seq = v => _lutc(SEQ, v);

/* ---------------------------------------------------------------- controls
   uiChip(x, y, w, h, label, state, alpha): a control drawn in the figure, as
   Figure 18b's chips are: white with a grey edge; the one chosen navy with
   white type; under the pointer steel with a navy edge; pressed steel2; off
   (unavailable) pale. Its edge is a line(), which the overlap check sees.
   state: {on, hover, down, off, size}; size is the label's (15 unless set).
   Keep its hit area at least 24 CSS px. */
function uiChip(x, y, w, h, label, st = {}, a = 1) {
  if (st.off) st = { off: true, size: st.size };                    // unavailable: no hover, no press
  const fill = st.on ? C.navy : st.down ? C.steel2 : st.hover ? C.steel : '#fff';
  const edge = st.off ? C.rule : st.on || st.hover || st.down ? C.navy : C.guide;
  line([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], { color: edge, width: 1, fill, close: true, alpha: a });
  const sz = st.size || 15;
  text(label, x + w / 2, y + h / 2 + sz / 3, { size: sz, align: 'center', alpha: a,
    color: st.on ? '#fff' : st.off ? C.guide : st.hover ? C.ink : C.body });
}

/* ---------------------------------------------------------------- data
   b64f32(s): a Float32Array from base64, for arrays too long for JSON. */
function b64f32(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); }
function b64i8(s) { const b = atob(s), u = new Int8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = (b.charCodeAt(i) << 24) >> 24; return u; }

const D = DATA;
const lab = t0 => settle(t0, .28);
const rise = s => 4 * (1 - s);
const MASTER = D.master, US = D.us, CL = D.cl;
const phase = () => ((t % MASTER) + MASTER) % MASTER;
/* the burst the probes send, s(tau), tau in us from its start */
function burst(tau) {
  if (tau < 0 || tau > D.dur) return null;
  return Math.sin(2 * Math.PI * D.f0 * tau) * .5 * (1 - Math.cos(2 * Math.PI * D.f0 * tau / D.nc));
}
/* text and math in a row; returns the width */
function row(parts, x, y, o = {}) {
  const w = parts.reduce((s, [k, v]) => s + (k === 't' ? text(v, 0, -1e4, { ...o, alpha: 0 }) : math(v, 0, -1e4, { ...o, alpha: 0 })), 0);
  let cx = o.align === 'right' ? x - w : o.align === 'center' ? x - w / 2 : x;
  for (const [k, v] of parts) cx += k === 't' ? text(v, cx, y, { ...o, align: 'left' }) : math(v, cx, y, { ...o, align: 'left' });
  return w;
}
function tip(x, y, ang, color, size = 7, alpha = 1) {        // a TikZ stealth tip at (x, y)
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - size * Math.cos(ang - .38), y - size * Math.sin(ang - .38));
  ctx.lineTo(x - size * .62 * Math.cos(ang), y - size * .62 * Math.sin(ang));
  ctx.lineTo(x - size * Math.cos(ang + .38), y - size * Math.sin(ang + .38)); ctx.closePath(); ctx.fill(); ctx.restore();
}
/* a cut through a long member: the edge with a small zigzag in it */
function cutEdge(x, y0, y1, p, alpha = 1) {
  const m = (y0 + y1) / 2;
  line([[x, y0], [x, m - 8], [x - 5, m - 3], [x + 5, m + 3], [x, m + 8], [x, y1]], { color: C.ink, width: 1.2, progress: p, alpha });
}
function piece(x0, y0, w, h, p, o = {}) {                     // steel: fill, top face, back wall, cut ends
  const { cut = true } = o;
  if (p <= 0) return;
  ctx.save(); ctx.fillStyle = C.steel; ctx.fillRect(x0, y0, w * clamp(p), h); ctx.restore();
  line([[x0, y0], [x0 + w, y0]], { width: 1.7, progress: p });
  line([[x0, y0 + h], [x0 + w, y0 + h]], { width: 2.6, progress: p });
  if (cut) { cutEdge(x0, y0, y0 + h, p); cutEdge(x0 + w, y0, y0 + h, p); }
  else { line([[x0, y0], [x0, y0 + h]], { width: 1.7, progress: p }); line([[x0 + w, y0], [x0 + w, y0 + h]], { width: 1.7, progress: p }); }
}
function crackLine(p0, p1, half, alpha = 1, prog = 1) {       // a crack: a thin crimson void
  if (prog <= 0) return;
  const a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) * prog;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(p0[0], p0[1]); ctx.rotate(a);
  ctx.beginPath(); ctx.ellipse(L / 2, 0, L / 2, Math.max(half, 2), 0, 0, 2 * Math.PI);
  ctx.fillStyle = C.accent; ctx.fill(); ctx.strokeStyle = '#781E2C'; ctx.lineWidth = .9; ctx.stroke(); ctx.restore();
}

const A = D.a, AX0 = D.ax0, AY0 = D.ay0, AS = D.as, AW = A.win * AS, AH = A.d * AS;
const PCX = AX0 + A.px * AS, LD = PCX + A.lanes[0] * AS, LU = PCX + A.lanes[1] * AS;
const ay = z => AY0 + z * AS, ax = x => AX0 + x * AS;
const SIG = A.sig, NS = SIG.v.length;
const G = D.g;
const gX = v => G.x + (v - G.xlim[0]) / (G.xlim[1] - G.xlim[0]) * G.w;
const gY = v => G.y + G.h - (v - G.ylim[0]) / (G.ylim[1] - G.ylim[0]) * G.h;
const SW = 9;                                                 // a lane pulse's half width
const POSTER_T = 6.6;
function packet(x, zLead, zTrail, zLo, zHi, f, color, up) {  // one pulse in a lane, z in mm
  const a = Math.max(zLo, Math.min(zLead, zTrail)), b = Math.min(zHi, Math.max(zLead, zTrail));
  if (b <= a) return;
  const pts = [];
  for (let z = a; z <= b + 1e-9; z += .05) { const v = f(z); pts.push([x + SW * (v === null ? 0 : v), ay(z)]); }
  line(pts, { color, width: 1.9 });
  if (zLead >= zLo && zLead <= zHi) tip(x, ay(zLead) + (up ? -3 : 3), up ? -Math.PI / 2 : Math.PI / 2, color, 9);
}
function draw() {
  // the probe, and what he calls it
  const pp = settle(.1, .28), la = lab(.2), pw = A.pw * AS;
  ctx.save(); ctx.globalAlpha *= pp; ctx.fillStyle = C.navy; ctx.fillRect(PCX - pw / 2, AY0 - 17 + rise(pp), pw, 17); ctx.restore();
  text('Acoustic sensor', D.lx, D.ly + rise(la), { size: 24, align: 'right', alpha: la });
  text('(sends and receives waves)', D.lx, D.ly + 27 + rise(la), { size: 20, color: C.body, align: 'right', alpha: la });
  arrow(D.lx + 7, D.ly + 8, PCX - pw / 2 - 4, AY0 - 11, { width: 1.3, head: 8, alpha: la });
  // the beam
  piece(AX0, AY0, AW, AH, seg(.02, .35));
  text('Steel beam', AX0 + 10, AY0 + AH - 13, { size: 23, color: C.body, alpha: lab(.3) });
  const dA = lab(.4);                                          // its depth d, as the signal's 2d / c_L uses it
  arrow(AX0 - 20, AY0, AX0 - 20, AY0 + AH, { width: 1.1, head: 8, both: true, color: C.ink, alpha: dA });
  math('d', AX0 - 29, AY0 + AH / 2 + 7, { size: 23, align: 'right', alpha: dA });
  const [c0, c1] = A.crack, cp = seg(.2, .25);
  crackLine([ax(c0[0]), ay(c0[1])], [ax(c1[0]), ay(c1[1])], A.cb * AS, 1, cp);
  text('crack', ax(c1[0]) + 8, ay(c1[1]) - 6, { size: 23, color: C.accent, alpha: lab(.35) });
  // the lanes' guides
  const gp = seg(.25, .3), ga = .9;
  line([[LD, AY0 + 6], [LD, AY0 + AH - 6]], { color: C.guide, width: 1, dash: [3, 4], progress: gp, alpha: ga });
  line([[LU, AY0 + AH - 6], [LU, AY0 + 6]], { color: C.guide, width: 1, dash: [3, 4], progress: gp, alpha: ga });
  if (gp >= 1) { tip(LD, AY0 + AH - 3, Math.PI / 2, C.guide, 7, ga); tip(LU, AY0 + 3, -Math.PI / 2, C.guide, 7, ga); }
  // the shot: tau, us after the probe starts to send; a shot every A.shot s
  const s = t - A.t0, ph = s < 0 ? -1 : s % A.shot, tau = ph * US;
  const fade = ph < 0 ? 0 : 1 - clamp((ph - (A.shot - .35)) / .3);
  if (ph >= 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(AX0, AY0 - 1, AW, AH + 2); ctx.clip();
    const d = A.d, z1 = A.z1, z2 = A.z2;
    packet(LD, CL * tau, CL * (tau - D.dur), 0, d, z => burst(tau - z / CL), C.navy, false);
    const t1 = z1 / CL;
    if (tau > t1) packet(LU, z1 - CL * (tau - t1), z1 - CL * (tau - t1 - D.dur), 0, z2, z => burst(tau - t1 - (z1 - z) / CL), C.accent, true);
    const tw = d / CL;
    if (tau > tw) packet(LU, d - CL * (tau - tw), d - CL * (tau - tw - D.dur), 0, d, z => burst(tau - tw - (d - z) / CL), C.navy, true);
    ctx.restore();
  }
  // the recorded signal
  const ap = seg(.05, .4);
  text('Recorded signal', G.x + G.w / 2, G.y - 16 + rise(lab(.1)), { size: 26, align: 'center', alpha: lab(.1) });
  const g = axes({ ...G, xticks: [0, 4, 8, 12, 16], yticks: [-1, 0, 1], progress: ap, tickSize: 19, labelSize: 22,
                   xlabel: '\\rm{Time}\\ t\\ (\\rm{µs})', ylabel: '\\rm{Amplitude}', ylabelGap: 46 });
  g.inside(() => line([[G.x, gY(0)], [G.x + G.w, gY(0)]], { color: C.rule, width: 1, alpha: ap }));
  /* the first shot records the signal as the echoes come back; after it the
     signal stays whole and each shot's cursor replays it */
  const first = t < A.t0 + A.shot, keep = first ? fade : 1;
  if (ph >= 0 && keep > 0) {
    const tn = tau - A.tdur;                                  // the signal's own time (burst centre = 0)
    const nNow = Math.min(NS, Math.floor((tn - SIG.t0) / SIG.dt) + 1), n = first ? nNow : NS;
    if (n > 1) {
      const pts = []; for (let i = 0; i < n; i++) pts.push([gX(SIG.t0 + i * SIG.dt), gY(SIG.v[i])]);
      g.inside(() => {
        line(pts, { color: C.navy, width: 1.7, alpha: keep });
        const i0 = Math.max(0, Math.floor((A.cwin[0] - SIG.t0) / SIG.dt)), i1 = Math.min(n, Math.ceil((A.cwin[1] - SIG.t0) / SIG.dt));
        if (i1 > i0 + 1) line(pts.slice(i0, i1), { color: C.accent, width: 1.9, alpha: keep });
      });
    }
    if (nNow > 0 && tn < G.xlim[1]) {                         // the cursor, below the words
      const xc = gX(tn), v = SIG.v[Math.max(0, nNow - 1)];
      line([[xc, gY(.62)], [xc, gY(-1.12)]], { color: C.ink, width: 1, alpha: .45 * fade });   // between the words and the dimension
      dot(xc, gY(v), 3.4, { color: C.navy, fill: C.navy, alpha: fade });
    }
    const seen = te => first ? fade * clamp((tn - te) / 2.5) : 1;   // a word arrives as the signal passes
    text('Excitation', gX(.8), gY(1.02), { size: 22, color: C.body, alpha: seen(0) });
    text('Reflection', gX(A.tc) - 14, gY(.8), { size: 22, color: C.accent, alpha: seen(A.tc) });   // above the cursor's reach
    text('Boundary', gX(A.tb) + 30, gY(1.02), { size: 22, color: C.body, align: 'right', alpha: seen(A.tb) });
    // the two way time, under the signal: a knockout as deep as the label's ink, clear of the axis box
    const da = seen(A.tb) * .95, yd = gY(-1.32);
    if (da > 0) {
      arrow(gX(0), yd, gX(2 * A.d / CL), yd, { width: .9, head: 6, both: true, color: C.muted, alpha: da });
      const s_ = '2d/c_{\\rm{L}} = ' + (2 * A.d / CL).toFixed(1) + '\\,\\rm{µs}';
      const lw = math(s_, 0, -1e4, { size: 19, alpha: 0 });
      const xm = (gX(0) + gX(2 * A.d / CL)) / 2;
      ctx.save(); ctx.globalAlpha *= da; ctx.fillStyle = '#fff'; ctx.fillRect(xm - lw / 2 - 4, yd - 11, lw + 8, 24); ctx.restore();
      math(s_, xm, yd + 6.5, { size: 19, color: C.muted, align: 'center', alpha: da });
    }
  }
  const pa = lab(.8);
  row([['m', 'c_{\\rm{L}} = 5900\\,\\rm{m/s}'], ['t', ', beam 40 mm deep; probe 12 mm, 2 MHz, 3 cycles']], AX0 - 30, H - 12, { size: 16, color: C.muted, alpha: pa });
  text(`shown ${(1e6 / US).toLocaleString('en-US')} × slower`, G.x + G.w, D.ly - 10, { size: 16, color: C.muted, align: 'right', alpha: pa });
}
boot();
</script>
