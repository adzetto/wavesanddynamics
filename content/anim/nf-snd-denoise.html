function fixedEnd(x, y, o = {}) {
  const { h = 30, dir = 1, color = C.ink, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2); ctx.stroke(); ctx.lineWidth = 1;
  for (let k = -h / 2; k < h / 2; k += 4.5) { ctx.beginPath(); ctx.moveTo(x, y + k + 4); ctx.lineTo(x - dir * 5, y + k); ctx.stroke(); }
  ctx.restore();
}
/* a dimension line |<- label ->| between x1 and x2 at height y */
function dim(x1, x2, y, label, o = {}) {
  const { color = C.ink, alpha = 1, size = 17 } = o;
  arrow(x1, y, x2, y, { color, width: 1.1, head: 7, both: true, alpha });
  line([[x1, y - 6], [x1, y + 6]], { color, width: 1, alpha }); line([[x2, y - 6], [x2, y + 6]], { color, width: 1, alpha });
  if (label) {
    ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font({ size }); ctx.restore();
    const w = math(label, 0, -1e4, { size, alpha: 0 });
    // the knockout covers the label's whole ink, superscripts to subscripts and the
    // slash's tail (baseline y + .34 size; ink from .95 size above it to .45 below)
    ctx.save(); ctx.fillStyle = '#fff'; ctx.globalAlpha *= alpha; ctx.fillRect((x1 + x2) / 2 - w / 2 - 4, y - size * .62, w + 8, size * 1.42); ctx.restore();
    math(label, (x1 + x2) / 2, y + size * .34, { size, align: 'center', color, alpha });
  }
}

/* ---------------------------------------------------------------- axes
   axes(o) draws a pgfplots axis: a full box, ticks pointing in, numeric
   tick labels, labels in math, and returns {X, Y, inside} to map data to
   the canvas. o = {x, y, w, h, xlim, ylim, xticks, yticks, xlabel, ylabel,
   xfmt, yfmt, grid, progress, alpha, ylog}. */
function axes(o) {
  const { x, y, w, h, xlim, ylim, xticks = [], yticks = [], xlabel = '', ylabel = '',
          xfmt = v => fmt(v), yfmt = v => fmt(v), grid = false, progress = 1, alpha = 1,
          box = true, tickSize = 15, labelSize = 17 } = o;
  const X = v => x + (v - xlim[0]) / (xlim[1] - xlim[0]) * w;
  const Y = v => y + h - (v - ylim[0]) / (ylim[1] - ylim[0]) * h;
  if (progress > 0) {
    const a = alpha * clamp(progress * 1.4);
    if (grid) {
      for (const v of xticks) line([[X(v), y], [X(v), y + h]], { color: C.grid, width: 1, alpha: a });
      for (const v of yticks) line([[x, Y(v)], [x + w, Y(v)]], { color: C.grid, width: 1, alpha: a });
    }
    const frame = box ? [[x, y + h], [x + w, y + h], [x + w, y], [x, y], [x, y + h]] : null;
    if (box) line(frame, { color: C.ink, width: 1.3, progress, alpha });
    else { line([[x, y + h], [x + w, y + h]], { color: C.ink, width: 1.3, progress, alpha }); line([[x, y + h], [x, y]], { color: C.ink, width: 1.3, progress, alpha }); }
    for (const v of xticks) {
      line([[X(v), y + h], [X(v), y + h - 5]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[X(v), y], [X(v), y + 5]], { color: C.ink, width: 1.1, alpha: a });
      math(xfmt(v), X(v), y + h + tickSize + 6, { size: tickSize, align: 'center', alpha: a });
    }
    for (const v of yticks) {
      line([[x, Y(v)], [x + 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[x + w, Y(v)], [x + w - 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      math(yfmt(v), x - 8, Y(v) + tickSize * .35, { size: tickSize, align: 'right', alpha: a });
    }
    if (xlabel) math(xlabel, x + w / 2, y + h + tickSize + labelSize + 16, { size: labelSize, align: 'center', alpha: a });
    if (ylabel) math(ylabel, x - (o.ylabelGap || 48), y + h / 2, { size: labelSize, align: 'center', rot: -Math.PI / 2, alpha: a });
  }
  const inside = f => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); f(); ctx.restore(); };
  return { X, Y, inside };
}
function fmt(v) {
  if (Math.abs(v) < 1e-12) return '0';
  const s = Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toPrecision(3));
  return s.replace('-', '−');
}

/* ---------------------------------------------------------------- colour
   diverging(v), v in [-1, 1]: navy, white, the warm accent, for a signed
   field (displacement, pressure). seq(v), v in [0, 1]: white to navy. The
   LUTs, 256 entries of r, g, b, colour an ImageData without a call per pixel. */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function _ramp(stops) {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(u)), s = u - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(lerp(stops[k][c], stops[k + 1][c], s));
  }
  return lut;
}
/* blue and crimson arms matched stop for stop in CIELAB lightness (19, 43, 75),
   so a value and its negative weigh the same */
const DIVERGING = _ramp(['#043052', '#2E6A9E', '#9CBBD6', '#FFFFFF', '#DEABAB', '#B03F4D', '#651020'].map(_hex));
const SEQ = _ramp(['#FFFFFF', '#C9D7E4', '#5B8DB8', '#095A94', '#043052'].map(_hex));
function _lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
const diverging = v => _lutc(DIVERGING, (v + 1) / 2);
const seq = v => _lutc(SEQ, v);

/* ---------------------------------------------------------------- controls
   uiChip(x, y, w, h, label, state, alpha): a control drawn in the figure, as
   Figure 18b's chips are: white with a grey edge; the one chosen navy with
   white type; under the pointer steel with a navy edge; pressed steel2; off
   (unavailable) pale. Its edge is a line(), which the overlap check sees.
   state: {on, hover, down, off, size}; size is the label's (15 unless set).
   Keep its hit area at least 24 CSS px. */
function uiChip(x, y, w, h, label, st = {}, a = 1) {
  if (st.off) st = { off: true, size: st.size };                    // unavailable: no hover, no press
  const fill = st.on ? C.navy : st.down ? C.steel2 : st.hover ? C.steel : '#fff';
  const edge = st.off ? C.rule : st.on || st.hover || st.down ? C.navy : C.guide;
  line([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], { color: edge, width: 1, fill, close: true, alpha: a });
  const sz = st.size || 15;
  text(label, x + w / 2, y + h / 2 + sz / 3, { size: sz, align: 'center', alpha: a,
    color: st.on ? '#fff' : st.off ? C.guide : st.hover ? C.ink : C.body });
}

/* ---------------------------------------------------------------- data
   b64f32(s): a Float32Array from base64, for arrays too long for JSON. */
function b64f32(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); }
function b64i8(s) { const b = atob(s), u = new Int8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = (b.charCodeAt(i) << 24) >> 24; return u; }

const D = DATA;
const POSTER_T = D.poster;
const lab = t0 => settle(t0, .28);
const T0 = D.t0, SW = D.dur, HOLD = D.hold, RST = .35, PER = SW + HOLD + RST;
function cursor() {                         // seconds of audio drawn so far, and the picture's fade
  if (t < T0) return { u: 0, a: 1 };
  const p = (t - T0) % PER;
  if (p < SW) return { u: p, a: 1 };
  if (p < SW + HOLD) return { u: SW, a: 1 };
  return { u: SW, a: 1 - easeInOut(clamp((p - SW - HOLD) / RST)) };
}

/* ------------------------------------------------------------ places */
const WN = { x: 22, y: 50, w: 120, h: 44 }, WS = { x: 22, y: 150, w: 120, h: 44 };
const MXB = { x: 168, y: 96, w: 86, h: 54 };
const WM = { x: 280, y: 101, w: 120, h: 44 };
const VT1 = { x: 424, y: 90, w: 128, h: 66 };
const SPM = { x: 262, y: 192, w: 250, h: 234 }, SPC = { x: 684, y: 192, w: 250, h: 234 };
const VAE = { x: 548, y: 259, w: 100, h: 100 };
const VT2 = { x: 110, y: 512, w: 132, h: 58 };
const BOTY = VT2.y + VT2.h / 2;

/* ------------------------------------------------------------ helpers */
function box(b, words, p, t0) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 1.5); ctx.fillStyle = C.steel; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.restore();
  line([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]], { width: 1.5, progress: p });
  const a = lab(t0), n = words.length, lh = 18;
  words.forEach((w, i) => text(w, b.x + b.w / 2, b.y + b.h / 2 + (i - (n - 1) / 2) * lh + 5.5, { size: 16, align: 'center', alpha: a }));
}
function wave(W, env, u, a, t0) {
  const n = env.length / 2, mid = W.y + W.h / 2;
  line([[W.x, mid], [W.x + W.w, mid]], { color: C.rule, width: 1, alpha: seg(t0, .3) });
  const k = Math.floor(n * clamp(u / SW));
  if (k < 1 || a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.navy; ctx.lineWidth = W.w / n * 1.05;
  ctx.beginPath();
  for (let i = 0; i < k; i++) {
    const x = W.x + (i + .5) * W.w / n;
    ctx.moveTo(x, mid - env[2 * i + 1] * W.h / 2); ctx.lineTo(x, mid - env[2 * i] * W.h / 2);
  }
  ctx.stroke(); ctx.restore();
  if (u < SW) line([[W.x + W.w * u / SW, W.y - 2], [W.x + W.w * u / SW, W.y + W.h + 2]], { color: C.accent, width: 1.2, alpha: a });
}
function spectro(P, cvs, u, a, t0) {
  const ap = seg(t0, .35);
  if (cvs && a > 0) {
    const cols = D.frames, done = u > 0 ? clamp(Math.floor((u - D.tf0) / D.hop) + 1, 0, cols) : 0;
    if (done > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(P.x, P.y, P.w * done / cols, P.h); ctx.clip();
      ctx.globalAlpha *= a; ctx.imageSmoothingEnabled = true; ctx.drawImage(cvs, P.x, P.y, P.w, P.h); ctx.restore();
    }
  }
  if (u < SW && a > 0 && u > 0) line([[P.x + P.w * u / SW, P.y], [P.x + P.w * u / SW, P.y + P.h]], { color: C.accent, width: 1.2, alpha: a });
  return ap;
}
function spAxes(P, left, t0) {
  const ap = seg(t0, .35);
  axes({ x: P.x, y: P.y, w: P.w, h: P.h, xlim: [0, SW], ylim: [0, 8], xticks: [0, .5, 1, 1.5], yticks: [0, 2, 4, 6, 8],
         progress: ap, tickSize: 16, labelSize: 17, yfmt: left ? (v => fmt(v)) : (() => ''), xlabel: left ? 't\\ (\\rm{s})' : '' });
  if (!left) {
    for (const v of [0, 2, 4, 6, 8]) math(fmt(v), P.x + P.w + 8, P.y + P.h - v / 8 * P.h + 5.6, { size: 16, alpha: clamp(ap * 1.4) });
    math('f\\ (\\rm{kHz})', P.x + P.w + 40, P.y + P.h / 2, { size: 17, align: 'center', rot: -Math.PI / 2, alpha: clamp(ap * 1.4) });
  } else math('f\\ (\\rm{kHz})', P.x - 40, P.y + P.h / 2, { size: 17, align: 'center', rot: -Math.PI / 2, alpha: clamp(ap * 1.4) });
}
function arr(pts, p, o = {}) {                  // a polyline ending in an arrow tip
  if (p <= 0) return;
  const n = pts.length;
  if (n > 2) line(pts.slice(0, n - 1), { width: 1.5, progress: p, ...o });
  if (p >= 1) { const a = pts[n - 2], b = pts[n - 1]; arrow(a[0], a[1], b[0], b[1], { width: 1.5, head: 9, ...o }); }
}

/* ------------------------------------------------------------ the pictures, coloured through SEQ */
const IMGS = {};
function paint(name) {
  const img = RAW[name], c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) { const v = d.data[i] * 3; d.data[i] = SEQ[v]; d.data[i + 1] = SEQ[v + 1]; d.data[i + 2] = SEQ[v + 2]; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); IMGS[name] = c;
}
const RAW = { mix: new Image(), clean: new Image() };
RAW.mix.src = D.img_mix; RAW.clean.src = D.img_clean;
const EN = b64f32(D.env_n), ES = b64f32(D.env_s), EM = b64f32(D.env_m);

/* ------------------------------------------------------------ the VAE: a block, no output of its own */
function vae(p, t0) {
  const a = lab(t0), cy = VAE.y + VAE.h / 2, zw = 14, gap = 7, tw = (VAE.w - zw - 2 * gap) / 2, nk = 20;
  const enc = [[VAE.x, VAE.y], [VAE.x + tw, cy - nk], [VAE.x + tw, cy + nk], [VAE.x, VAE.y + VAE.h]];
  const dec = [[VAE.x + VAE.w, VAE.y], [VAE.x + VAE.w - tw, cy - nk], [VAE.x + VAE.w - tw, cy + nk], [VAE.x + VAE.w, VAE.y + VAE.h]];
  for (const q of [enc, dec]) {
    if (p >= 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.steel; ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (const r of q.slice(1)) ctx.lineTo(r[0], r[1]); ctx.closePath(); ctx.fill(); ctx.restore(); }
    line(q.concat([q[0]]), { width: 1.5, progress: p });
  }
  const zx = VAE.x + VAE.w / 2;
  line([[zx - zw / 2, cy - 14], [zx + zw / 2, cy - 14], [zx + zw / 2, cy + 14], [zx - zw / 2, cy + 14], [zx - zw / 2, cy - 14]], { width: 1.3, progress: p });
  line([[VAE.x + tw, cy], [zx - zw / 2, cy]], { width: 1.2, alpha: a });
  line([[zx + zw / 2, cy], [VAE.x + VAE.w - tw, cy]], { width: 1.2, alpha: a });
  math('z', zx, cy + 6, { size: 17, align: 'center', alpha: a });
  text('encoder', VAE.x + tw / 2, VAE.y + VAE.h + 22, { size: 16, color: C.body, align: 'center', alpha: a });
  text('decoder', VAE.x + VAE.w - tw / 2, VAE.y + VAE.h + 22, { size: 16, color: C.body, align: 'center', alpha: a });
}

function draw() {
  const c = cursor(), u = c.u, fa = c.a;
  // sources, mixing, mixed audio
  const la = lab(.05);
  text('Background noise', WN.x, WN.y - 12, { size: 17, alpha: la });
  text('Speech audio', WS.x, WS.y - 12, { size: 17, alpha: lab(.08) });
  wave(WN, EN, u, fa, .05);
  wave(WS, ES, u, fa, .08);
  box(MXB, ['Audio', 'mixing'], seg(.1, .35), .15);
  arr([[WN.x + WN.w + 6, WN.y + WN.h / 2], [MXB.x - 4, MXB.y + 14]], seg(.15, .3));
  arr([[WS.x + WS.w + 6, WS.y + WS.h / 2], [MXB.x - 4, MXB.y + MXB.h - 14]], seg(.17, .3));
  arr([[MXB.x + MXB.w + 4, MXB.y + MXB.h / 2], [WM.x - 6, MXB.y + MXB.h / 2]], seg(.22, .3));
  text('Mixed audio', WM.x, WM.y - 12, { size: 17, alpha: lab(.2) });
  wave(WM, EM, u, fa, .2);
  arr([[WM.x + WM.w + 6, WM.y + WM.h / 2], [VT1.x - 4, WM.y + WM.h / 2]], seg(.28, .3));
  box(VT1, ['Visual', 'transformation', 'representation'], seg(.25, .35), .3);
  arr([[VT1.x + VT1.w / 2, VT1.y + VT1.h + 4], [VT1.x + VT1.w / 2, SPM.y - 6]], seg(.32, .3));
  // the pictures
  spectro(SPM, IMGS.mix, u, fa, .3);
  spAxes(SPM, true, .3);
  const nm = lab(.4);
  ['Visual representation', 'mixed audio'].forEach((w, i) => text(w, SPM.x + SPM.w / 2, SPM.y + SPM.h + 76 + i * 20, { size: 17, align: 'center', alpha: nm }));
  arr([[SPM.x + SPM.w + 6, VAE.y + VAE.h / 2], [VAE.x - 4, VAE.y + VAE.h / 2]], seg(.38, .3));
  vae(seg(.34, .4), .42);
  ['Variational', 'Autoencoder'].forEach((w, i) => text(w, VAE.x + VAE.w / 2, VAE.y - 36 + i * 20, { size: 17, align: 'center', alpha: lab(.42) }));
  arr([[VAE.x + VAE.w + 4, VAE.y + VAE.h / 2], [SPC.x - 6, VAE.y + VAE.h / 2]], seg(.44, .3));
  spectro(SPC, IMGS.clean, u, fa, .4);
  spAxes(SPC, false, .4);
  ['Visual representation', 'speech audio'].forEach((w, i) => text(w, SPC.x + SPC.w / 2, SPC.y - 36 + i * 20, { size: 17, align: 'center', alpha: lab(.46) }));
  // the speech audio's own path: the target
  const bx = WS.x + 50;
  arr([[bx, WS.y + WS.h + 6], [bx, BOTY], [VT2.x - 4, BOTY]], seg(.3, .4));
  box(VT2, ['Visual', 'transformation', 'representation'], seg(.35, .35), .4);
  arr([[VT2.x + VT2.w + 4, BOTY], [D.upx, BOTY], [D.upx, SPC.y + SPC.h + 6]], seg(.42, .45));
  // the colour scale
  colorbar(seg(.5, .3));
  math(D.params, 22, H - 10, { size: 15, color: C.muted, alpha: seg(.55, .3) });
}
function colorbar(a) {
  if (a <= 0) return;
  const x0 = VAE.x + 4, w = VAE.w - 8, y0 = SPM.y + SPM.h + 28, h = 8;
  if (!colorbar.c) { const c = document.createElement('canvas'); c.width = 256; c.height = 1; const g = c.getContext('2d'), d = g.createImageData(256, 1);
    for (let i = 0; i < 256; i++) d.data.set([SEQ[3 * i], SEQ[3 * i + 1], SEQ[3 * i + 2], 255], 4 * i); g.putImageData(d, 0, 0); colorbar.c = c; }
  ctx.save(); ctx.globalAlpha *= a; ctx.imageSmoothingEnabled = true; ctx.drawImage(colorbar.c, x0, y0, w, h); ctx.restore();
  line([[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h], [x0, y0]], { width: .8, alpha: a });
  for (const v of [-60, -30, 0]) {
    const x = x0 + (v + D.dbr) / D.dbr * w;
    line([[x, y0 + h], [x, y0 + h + 3]], { width: .8, alpha: a });
    math(fmt(v), x, y0 + h + 19, { size: 16, align: 'center', alpha: a });
  }
  text('dB', x0 + w + 7, y0 + h + 1, { size: 16, alpha: a });
}
Promise.all([RAW.mix.decode(), RAW.clean.decode()]).then(() => { paint('mix'); paint('clean'); }).catch(() => {}).finally(() => boot());
</script>
