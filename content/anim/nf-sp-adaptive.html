const STILL = /[?&]still\b/.test(location.search);
const CHECK = /[?&]overlap\b/.test(location.search);   // ?still&overlap: report ink that collides
const AT = /[?&]t=([\d.]+)/.exec(location.search);   // ?still&t=2.5: one moment, to look at

/* the palette: the site's inks and blues (site/parts/theme.py) and one

   blue in CIELAB lightness (accent L* 37 = blue, amber L* 50) at hue 20, so

   roles, kept from the first palette so no figure had to change. */

/* ---------------------------------------------------------------- axes

  const Y = v => y + h - (v - ylim[0]) / (ylim[1] - ylim[0]) * h;

    const a = alpha * clamp(progress * 1.4);
    if (grid) {

      for (const v of yticks) line([[x, Y(v)], [x + w, Y(v)]], { color: C.grid, width: 1, alpha: a });
    }
    const frame = box ? [[x, y + h], [x + w, y + h], [x + w, y], [x, y], [x, y + h]] : null;
    if (box) line(frame, { color: C.ink, width: 1.3, progress, alpha });

                  xlabel: '\\rm{frequency}\\ f\\ (\\rm{Hz})', ylabel: '|H|,\\ |W|', ylabelGap: 36,
                  grid: true, progress: seg(.14, .35)});
  const fx = i => A.X(i / (NF - 1) * FS / 2);
  const hp = []; for (let i = 0; i < NF; i++) hp.push([fx(i), A.Y(HM[i])]);
  const n0 = Math.floor(nf), fr = nf - n0, n1 = Math.min(N, n0 + 1);
  const WM = magnitude(k => lerp(wAt(n0, k), wAt(n1, k), fr));
  const wp = []; for (let i = 0; i < NF; i++) wp.push([fx(i), A.Y(WM[i])]);
  A.inside(() => {                      // the filter under, the system's dashes on top: they meet
    if (t >= T0) line(wp, {color: C.blue, width: 2.4, alpha: seg(T0, .2)});
    line(hp, {color: C.navy, width: 1.6, dash: [7, 4], progress: seg(.22, .4)});
  });
  // legend
  const la = seg(.4, .25), LX = PC.x + PC.w - 178, LY = PC.y + 10;
  if (la > 0) {
    ctx.save(); ctx.globalAlpha *= la; ctx.fillStyle = '#fff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
    ctx.fillRect(LX, LY, 170, 50); ctx.strokeRect(LX, LY, 170, 50); ctx.restore();
    line([[LX + 10, LY + 17], [LX + 38, LY + 17]], {color: C.navy, width: 1.6, dash: [7, 4], alpha: la});
    text('unknown system', LX + 46, LY + 22, {size: 15, alpha: la});
    line([[LX + 10, LY + 37], [LX + 38, LY + 37]], {color: C.blue, width: 2.4, alpha: la});
    text('adaptive filter', LX + 46, LY + 42, {size: 15, alpha: la});
  }
}

function draw() {
  const nf = nNow();
  panelA(nf);
  panelB(nf);
  panelC(nf);
  math(D.params, 20, H - 14, {size: 14, color: C.muted, alpha: seg(.45, .3)});
}
boot();
</script>
