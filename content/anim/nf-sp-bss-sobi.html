/* numfig engine: the shared runtime of the figures redrawn from numerical
   models (tools/numfig/README.md). build_html() in common.py inlines it after
   `const W = ..., H = ...;` and the figure's DATA, and before the figure's own
   script, which defines draw() and may define POSTER_T and reset().

   Same frame as his animations (content/anim/fig*.html): a canvas W by H in
   drawing units, scaled to the width it is given; pause, restart, a click on
   the canvas toggles; paused while off screen. In the guide's page the pause
   and restart are the page's, in a row under the frame (HOSTED, below).
   Unlike them the type is
   Computer Modern (CMU Serif, published in ../fonts/), and a reader who asks
   for less motion, or the print still (?still), gets the figure complete at
   POSTER_T instead of the empty first frame. */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
/* CMU Serif, then Figure Math (Latin Modern Math's symbols, content/fonts-cmu/
   README.txt) for the signs CMU does not carry: every glyph in Computer Modern */
const SERIF = '"CMU Serif", "Figure Math", "Latin Modern Roman", "Latin Modern Math", serif';
const STILL = /[?&]still\b/.test(location.search);
const CHECK = /[?&]overlap\b/.test(location.search);   // ?still&overlap: report ink that collides
const AT = /[?&]t=([\d.]+)/.exec(location.search);   // ?still&t=2.5: one moment, to look at
const REDUCED =matchMedia('(prefers-reduced-motion: reduce)').matches;

/* the palette: the site's inks and blues (site/parts/theme.py) and one
   crimson. Blue is the structure and the primary data, crimson is the one
   thing the eye should follow, grey is guides. The crimson is matched to the
   blue in CIELAB lightness (accent L* 37 = blue, amber L* 50) at hue 20, so
   neither side of a comparison shouts; the names accent/amber/wash are the
   roles, kept from the first palette so no figure had to change. */
const C = {
  ink: '#27221C', body: '#544F48', muted: '#6F6A64', guide: '#8A857C',
  rule: '#D7D2CA', grid: '#ECE8E2',
  navy: '#043052', blue: '#095A94', sky: '#5B8DB8', mist: '#A9C3DA',
  steel: '#E3EBF2', steel2: '#C9D7E4',
  accent: '#A7203A', amber: '#D14457', wash: '#F9EEEE',
};

let t = 0, last = null, visible = true;
let playing = !REDUCED && !STILL;
cv.style.aspectRatio = W + ' / ' + H;

/* ---------------------------------------------------------------- time */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, s) => a + (b - a) * s;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
/* progress of a step of the intro that starts at t0 and lasts dur, eased */
const seg = (t0, dur, e = easeInOut) => e(clamp((t - t0) / dur));

function panelD(v) {
  const s = st(), a = v.jon, la = arrive(.12), J = th => s.J[0] + s.J[1] * Math.cos(4 * th) + s.J[2] * Math.sin(4 * th);
  sub('d', SC.x - 72, PS.y - 38, 'off-diagonal against angle', la);
  const ax = axes({x: JB.x, y: JB.y, w: JB.w, h: JB.h, xlim: [0, 90], ylim: [0, 1.05], xticks: [0, 45, 90], yticks: [0, 1],
    xlabel: '\\rm{rotation angle}\\ \\theta\\ (\\rm{deg})', ylabel: 'J(\\theta)', ylabelGap: 34, tickSize: 16, labelSize: 17,
    progress: seg(.12, .35), alpha: a});
  const pts = []; for (let i = 0; i <= 180; i++) { const d = i / 2; pts.push([ax.X(d), ax.Y(J(d * Math.PI / 180))]); }
  const thd = s.th * 180 / Math.PI;
  ax.inside(() => {
    line([[ax.X(thd), JB.y + JB.h], [ax.X(thd), ax.Y(J(s.th))]], {color: C.guide, width: 1, dash: [5, 4], alpha: a * seg(.4, .3)});
    line(pts, {color: C.navy, width: 2.2, progress: seg(.25, .45), alpha: a});
  });
  dot(ax.X(v.ang * 180 / Math.PI), ax.Y(J(v.ang)), 5, {color: '#fff', fill: C.accent, width: 1.4, alpha: a * seg(.45, .25)});
}
function table(v) {
  const s = st(), a = arrive(.35) * lerp(.55, 1, v.ov), aw = a * lerp(.55, 1, v.den), {x0, x1, y} = TB;
  const cx = [x0 + 168, x0 + 226, x1 - 58, x1];          // right edges of SIR s1, SIR s2, rho s1, rho s2
  rule(x0, x1, y, 1.3, a);
  text('SIR (dB)', (cx[0] + cx[1]) / 2 - 22, y + 20, {size: 15, color: C.body, align: 'center', alpha: a});
  math('\\rm{correlation}\\ \\rho', (cx[2] + cx[3]) / 2 - 20, y + 20, {size: 15, color: C.body, align: 'center', alpha: a});
  [0, 1, 2, 3].forEach(c => math('s_' + (c % 2 + 1), cx[c], y + 41, {size: 15, color: C.body, align: 'right', alpha: a}));
  rule(x0, x1, y + 49, .8, a);
  const rows = [['kurtosis ICA', s.k], ['SOBI family', s.o], ['+ Wiener', s.w]];
  rows.forEach(([name, r], j) => {
    const yy = y + 68 + j * 22, al = j === 2 ? aw : a;
    text(name, x0, yy, {size: 15, alpha: al});
    if (r.sir) r.sir.forEach((t, c) => text(t, cx[c], yy, {size: 15, align: 'right', alpha: al}));
    r.rho.forEach((t, c) => text(t, cx[2 + c], yy, {size: 15, align: 'right', alpha: al}));
  });
  rule(x0, x1, y + 118, 1.3, a);
  math(s.note, x0, y + 138, {size: 14, color: C.muted, alpha: arrive(.4)});
}
function controls() {
  const a = arrive(.4);
  text('SNR (dB)', SN.x - 10, SN.y + 19, {size: 15, color: C.body, align: 'right', alpha: a});
  D.snrs.forEach((v, i) => chip(SN.x + i * SN.pitch, SN.y, SN.w, SN.h, num(v, 0), null,
    {on: i === SEL, hover: HOV.snr === i, down: DOWN.snr === i}, arrive(.4 + .01 * i)));
  text('record', RC.x - 10, RC.y + 19, {size: 15, color: C.body, align: 'right', alpha: a});
  D.T.forEach((v, i) => chip(RC.x + i * RC.pitch, RC.y, RC.w, RC.h, v + ' s', null,
    {on: i === REC, hover: HOV.rec === i, down: DOWN.rec === i}, arrive(.45 + .02 * i)));
}
function draw() {
  const {w, v} = view(), cur = cursor(w);
  stageRow(w.k, w.ph);
  panelA(v, cur);
  panelB(v, cur);
  panelC(v);
  panelD(v);
  table(v);
  controls();
  mixed(D.params, 18, H - 12, {size: 14, color: C.muted, alpha: seg(.5, .3)});
}
function status() {
  const s = st(), k = clock().k;
  return 'Stage ' + (k + 1) + ' of ' + NS + ', ' + STAGES[k][0] + '. SNR ' + D.snrs[SEL] + ' dB, ' + D.T[REC] + ' s record: SIR ' +
    s.o.sir.join(' and ') + ' dB here, ' + s.k.sir.join(' and ') + ' dB with kurtosis ICA; correlation after Wiener ' + s.w.rho.join(' and ') + '.';
}
const GS = group('stage', 'Stage of the method', STAGES.map((s, i) => ({aria: 'Stage ' + (i + 1) + ': ' + s[0]})),
  () => clock().k, j => chooseStage(j));
const GN = group('snr', 'Sensor SNR', D.snrs.map(v => ({aria: 'SNR ' + v + ' dB'})), () => SEL, i => chooseData(() => { SEL = i; }));
const GR = group('rec', 'Record length', D.T.map(v => ({aria: 'Record ' + v + ' s'})), () => REC, i => chooseData(() => { REC = i; }));
place(GN, D.snrs.map((_, i) => [SN.x + i * SN.pitch - (SN.pitch - SN.w) / 2, SN.y - 8, SN.pitch, SN.h + 16]));
place(GR, D.T.map((_, i) => [RC.x + i * RC.pitch - (RC.pitch - RC.w) / 2, RC.y - 8, RC.pitch, RC.h + 16]));
BANDS.push([SN.x - 80, SN.y - 10, RC.x + D.T.length * RC.pitch + 6, SN.y + SN.h + 10]);
function reset() { TOUR0 = TOUR_START; JUMP = null; CHG = null; sync(); }
sync();
boot();
</script>
