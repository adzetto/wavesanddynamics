  const { h = 30, dir = 1, color = C.ink, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2); ctx.stroke(); ctx.lineWidth = 1;
  for (let k = -h / 2; k < h / 2; k += 4.5) { ctx.beginPath(); ctx.moveTo(x, y + k + 4); ctx.lineTo(x - dir * 5, y + k); ctx.stroke(); }
  ctx.restore();
}
/* a dimension line |<- label ->| between x1 and x2 at height y */
function dim(x1, x2, y, label, o = {}) {
  const { color = C.ink, alpha = 1, size = 17 } = o;
  arrow(x1, y, x2, y, { color, width: 1.1, head: 7, both: true, alpha });
  line([[x1, y - 6], [x1, y + 6]], { color, width: 1, alpha }); line([[x2, y - 6], [x2, y + 6]], { color, width: 1, alpha });
  if (label) {
    ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font({ size }); ctx.restore();
    const w = math(label, 0, -1e4, { size, alpha: 0 });
    // the knockout covers the label's whole ink, superscripts to subscripts and the
    // slash's tail (baseline y + .34 size; ink from .95 size above it to .45 below)
    ctx.save(); ctx.fillStyle = '#fff'; ctx.globalAlpha *= alpha; ctx.fillRect((x1 + x2) / 2 - w / 2 - 4, y - size * .62, w + 8, size * 1.42); ctx.restore();
    math(label, (x1 + x2) / 2, y + size * .34, { size, align: 'center', color, alpha });
  }
}

/* ---------------------------------------------------------------- axes
   axes(o) draws a pgfplots axis: a full box, ticks pointing in, numeric
   tick labels, labels in math, and returns {X, Y, inside} to map data to
   the canvas. o = {x, y, w, h, xlim, ylim, xticks, yticks, xlabel, ylabel,
   xfmt, yfmt, grid, progress, alpha, ylog}. */
function axes(o) {
  const { x, y, w, h, xlim, ylim, xticks = [], yticks = [], xlabel = '', ylabel = '',
          xfmt = v => fmt(v), yfmt = v => fmt(v), grid = false, progress = 1, alpha = 1,
          box = true, tickSize = 15, labelSize = 17 } = o;
  const X = v => x + (v - xlim[0]) / (xlim[1] - xlim[0]) * w;
  const Y = v => y + h - (v - ylim[0]) / (ylim[1] - ylim[0]) * h;
  if (progress > 0) {
    const a = alpha * clamp(progress * 1.4);
    if (grid) {
      for (const v of xticks) line([[X(v), y], [X(v), y + h]], { color: C.grid, width: 1, alpha: a });
      for (const v of yticks) line([[x, Y(v)], [x + w, Y(v)]], { color: C.grid, width: 1, alpha: a });
    }
    const frame = box ? [[x, y + h], [x + w, y + h], [x + w, y], [x, y], [x, y + h]] : null;
    if (box) line(frame, { color: C.ink, width: 1.3, progress, alpha });
    else { line([[x, y + h], [x + w, y + h]], { color: C.ink, width: 1.3, progress, alpha }); line([[x, y + h], [x, y]], { color: C.ink, width: 1.3, progress, alpha }); }
    for (const v of xticks) {
      line([[X(v), y + h], [X(v), y + h - 5]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[X(v), y], [X(v), y + 5]], { color: C.ink, width: 1.1, alpha: a });
      math(xfmt(v), X(v), y + h + tickSize + 6, { size: tickSize, align: 'center', alpha: a });
    }
    for (const v of yticks) {
      line([[x, Y(v)], [x + 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[x + w, Y(v)], [x + w - 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      math(yfmt(v), x - 8, Y(v) + tickSize * .35, { size: tickSize, align: 'right', alpha: a });
    }
    if (xlabel) math(xlabel, x + w / 2, y + h + tickSize + labelSize + 16, { size: labelSize, align: 'center', alpha: a });
    if (ylabel) math(ylabel, x - (o.ylabelGap || 48), y + h / 2, { size: labelSize, align: 'center', rot: -Math.PI / 2, alpha: a });
  }
  const inside = f => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); f(); ctx.restore(); };
  return { X, Y, inside };
}
function fmt(v) {
  if (Math.abs(v) < 1e-12) return '0';
  const s = Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toPrecision(3));
  return s.replace('-', '−');
}

/* ---------------------------------------------------------------- colour
   diverging(v), v in [-1, 1]: navy, white, the warm accent, for a signed
   field (displacement, pressure). seq(v), v in [0, 1]: white to navy. The
   LUTs, 256 entries of r, g, b, colour an ImageData without a call per pixel. */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function _ramp(stops) {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(u)), s = u - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(lerp(stops[k][c], stops[k + 1][c], s));
  }
  return lut;
}
/* blue and crimson arms matched stop for stop in CIELAB lightness (19, 43, 75),
   so a value and its negative weigh the same */
const DIVERGING = _ramp(['#043052', '#2E6A9E', '#9CBBD6', '#FFFFFF', '#DEABAB', '#B03F4D', '#651020'].map(_hex));
const SEQ = _ramp(['#FFFFFF', '#C9D7E4', '#5B8DB8', '#095A94', '#043052'].map(_hex));
function _lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
const diverging = v => _lutc(DIVERGING, (v + 1) / 2);
const seq = v => _lutc(SEQ, v);

/* ---------------------------------------------------------------- controls
   uiChip(x, y, w, h, label, state, alpha): a control drawn in the figure, as
   Figure 18b's chips are: white with a grey edge; the one chosen navy with
   white type; under the pointer steel with a navy edge; pressed steel2; off
   (unavailable) pale. Its edge is a line(), which the overlap check sees.
   state: {on, hover, down, off, size}; size is the label's (15 unless set).
   Keep its hit area at least 24 CSS px. */
function uiChip(x, y, w, h, label, st = {}, a = 1) {
  if (st.off) st = { off: true, size: st.size };                    // unavailable: no hover, no press
  const fill = st.on ? C.navy : st.down ? C.steel2 : st.hover ? C.steel : '#fff';
  const edge = st.off ? C.rule : st.on || st.hover || st.down ? C.navy : C.guide;
  line([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], { color: edge, width: 1, fill, close: true, alpha: a });
  const sz = st.size || 15;
  text(label, x + w / 2, y + h / 2 + sz / 3, { size: sz, align: 'center', alpha: a,
    color: st.on ? '#fff' : st.off ? C.guide : st.hover ? C.ink : C.body });
}

/* ---------------------------------------------------------------- data
   b64f32(s): a Float32Array from base64, for arrays too long for JSON. */
function b64f32(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); }
function b64i8(s) { const b = atob(s), u = new Int8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = (b.charCodeAt(i) << 24) >> 24; return u; }

const POSTER_T = 4.3622;
const SLOW = DATA.slow, TS = 0.35, RAMP = 0.25, NX = DATA.nx, NF = DATA.nf;
function clock() { const s = t - TS; return s <= 0 ? 0 : s < RAMP ? s * s / (2 * RAMP) : s - RAMP / 2; }
const lab = t0 => settle(t0, .28);
function unpack(p) { const q = b64i8(p.q), s = p.s / 127, out = new Float32Array(q.length); for (let i = 0; i < q.length; i++) out[i] = q[i] * s; return out; }
const ROWS = {};
for (const k of ['res', 'off']) { const r = DATA.rows[k]; ROWS[k] = { f: r.f, kl: r.kl, tot: unpack(r.tot), left: unpack(r.left) }; }
const GMAX = Math.max(...['res', 'off'].map(k => { let m = 0; const a = ROWS[k].tot; for (let i = 0; i < a.length; i += 2) m = Math.max(m, Math.hypot(a[i], a[i + 1])); return m; }));
const inCycle = tp => ((tp % DATA.cycle) + DATA.cycle) % DATA.cycle;   // the time within the cycle (the response repeats)
/* the field at physical time tp (s): Re{W e^{i w_c c}}, c the time within the cycle, W interpolated between frames */
function field(k, arr, tp) {
  const c = inCycle(tp), p = c / DATA.T3 * DATA.fps, j = Math.min(NF - 2, Math.floor(p)), s = p - j;
  const ph = 2 * Math.PI * ROWS[k].f * c, co = Math.cos(ph), si = Math.sin(ph), out = new Float32Array(NX);
  for (let i = 0; i < NX; i++) {
    const a = (j * NX + i) * 2, b = ((j + 1) * NX + i) * 2;
    const re = lerp(arr[a], arr[b], s), im = lerp(arr[a + 1], arr[b + 1], s);
    out[i] = (re * co - im * si) / GMAX;
  }
  return out;
}
function envelope(tp) {
  const c = inCycle(tp), r = DATA.ramp * DATA.T3, h = DATA.hold * DATA.T3;
  if (c < r) return .5 * (1 - Math.cos(Math.PI * c / r)); if (c < r + h) return 1;
  if (c < 2 * r + h) return .5 * (1 + Math.cos(Math.PI * (c - r - h) / r)); return 0;
}
const tphys = () => clock() / SLOW + 0.014212637;             // the loop starts 3 periods into the drive
function sub(letter, x, y, words, a) { panel(letter, x, y, { alpha: a }); text(words, x + 36, y, { size: 18, color: C.body, alpha: a }); }
const A = 40;
function beamAt(x0, y, prog) {
  line([[x0, y], [x0 + 360, y]], { color: C.ink, width: 1.8, progress: prog });
  if (prog > 0) { pin(x0, y, { s: 12 }); pin(x0 + 360, y, { s: 12, alpha: clamp(prog * 4 - 3) }); }
}
const pts = (x0, y, w, amp) => Array.from(w, (v, i) => [x0 + i / (NX - 1) * 360, y - amp * v]);
/* the moment M(t) at the left pin: an arc on the pin's outer side whose sweep follows M
   (counterclockwise for M > 0), its head as large as the arc allows; it fades out as M
   passes through zero, so no head is ever left without its arc */
function momentArc(x, y, m, a) {
  const r = 22, th = Math.abs(m) * 2.6, len = r * th, al = a * clamp((len - 9) / 9);
  if (al <= 0) return;
  const sg = Math.sign(m), from = Math.PI + sg * th / 2, to = Math.PI - sg * th / 2;
  const p = []; for (let i = 0; i <= 24; i++) { const u = lerp(from, to, i / 24); p.push([x + r * Math.cos(u), y + r * Math.sin(u)]); }
  line(p.slice(0, -2), { color: C.ink, width: 1.6, alpha: al });
  const e = p[p.length - 1], q = p[p.length - 3];
  arrow(q[0], q[1], e[0], e[1], { color: C.ink, width: 1.6, head: Math.min(8, .4 * len), alpha: al });
}
/* forced vibration while M(t) drives (switched on, held, switched off), free
   vibration from the moment it is off to the cycle's end */
const C_OFF = (2 * DATA.ramp + DATA.hold) * DATA.T3;
/* 1 in the forced part, 0 in the free part; at each switch it passes to the
   other over 0.3 s of the page's clock, so the names follow the cursor */
function forcedW(tp) {
  const c = inCycle(tp);
  return c < C_OFF ? easeInOut(clamp(c * SLOW / .3)) : 1 - easeInOut(clamp((c - C_OFF) * SLOW / .3));
}
/* a TikZ brace (decoration brace, mirrored) under [x0, x1] from height y, its tip h below at the middle */
function brace(x0, x1, y, h, o) {
  const r = h / 2, xm = (x0 + x1) / 2, pts = [];
  const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= 8; i++) { const a = lerp(a0, a1, i / 8); pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  arc(x0 + r, y, Math.PI, Math.PI / 2); arc(xm - r, y + h, -Math.PI / 2, 0);
  arc(xm + r, y + h, Math.PI, 1.5 * Math.PI); arc(x1 - r, y, Math.PI / 2, 0);
  line(pts, o);
}
function mixc(a, b, s) { const A = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), B = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(s))).toString(16).padStart(2, '0')).join(''); }
const node = (x, y, a) => dot(x, y, 4.5, { color: C.ink, fill: '#fff', width: 1.6, alpha: a });   // a node: white, an ink ring

function row(key, y0, letters, words, t0, tp) {
  const [la, lb] = letters, [wa, wb] = words;
  sub(la, 18, y0, wa, lab(t0)); sub(lb, 520, y0, wb, lab(t0 + .04));
  const ya = y0 + 100, xa = 60, xb = 560;
  beamAt(xa, ya, seg(t0, .35)); beamAt(xb, ya, seg(t0 + .05, .35));
  const R = ROWS[key], tot = field(key, R.tot, tp), left = field(key, R.left, tp);
  // (a), (c): the reflection (crimson, the one thing to follow) and the sum
  line(pts(xa, ya, left, A), { color: C.accent, width: 1.5, progress: seg(t0 + .2, .4) });
  line(pts(xa, ya, tot, A), { color: C.blue, width: 2.4, progress: seg(t0 + .15, .4) });
  const env = envelope(tp), m = env * Math.sin(2 * Math.PI * R.f * inCycle(tp));
  momentArc(xa, ya, m, lab(t0 + .3));
  const ha = lab(t0 + .4);
  arrow(xa + 40, y0 + 30, xa + 120, y0 + 30, { width: 1.8, head: 9, alpha: ha, color: C.ink });
  text('Wave', xa + 40, y0 + 53, { size: 17, color: C.body, alpha: ha });
  arrow(xa + 320, y0 + 30, xa + 240, y0 + 30, { width: 1.8, head: 9, alpha: ha, color: C.accent });
  text('Reflection', xa + 320, y0 + 53, { size: 17, color: C.body, align: 'right', alpha: ha });
  math(key === 'res' ? 'L = 3\\,\\lambda/2' : 'L = 3.5\\,\\lambda/2', xa + 180, ya + 63, { size: 18, align: 'center', alpha: ha });
  math(`f = ${R.f.toFixed(1)}\\,\\rm{Hz}`, xa + 180, ya + 86, { size: 16, align: 'center', color: C.muted, alpha: ha });
  // (b), (d): the last period, earlier shapes fading
  const sa = lab(t0 + .45);
  if (sa > 0) for (let j = 8; j >= 1; j--) {
    const w = field(key, R.tot, tp - j / R.f / 8);
    line(pts(xb, ya, w, A), { color: C.mist, width: 1.2, alpha: sa * (1 - j / 10) });
  }
  line(pts(xb, ya, tot, A), { color: C.blue, width: 2.4, progress: seg(t0 + .2, .4) });
  const za = lab(t0 + .5);
  if (key === 'res') for (const z of DATA.nodes) node(xb + z / DATA.L * 360, ya, za);
  // the drive, over the cycle: forced vibration while M(t) drives, free vibration once it is off
  const yd = ya + 66, xd0 = xb, xd1 = xb + 360, da = lab(t0 + .55);
  if (da > 0) {
    const e = []; for (let i = 0; i <= 120; i++) { const c = i / 120 * DATA.cycle; e.push([lerp(xd0, xd1, i / 120), yd - 12 * envelope(c)]); }
    line(e, { color: C.guide, width: 1.1, alpha: da });
    line([[xd0, yd], [xd1, yd]], { color: C.rule, width: 1, alpha: da });
    const xc = lerp(xd0, xd1, inCycle(tp) / DATA.cycle);
    line([[xc, yd + 3], [xc, yd - 15]], { color: C.ink, width: 1.6, alpha: da });
    math('M(t)', xd0 - 9, yd - 1, { size: 16, align: 'right', color: C.muted, alpha: da });
    // each part of the drive named under it, the one the cursor is in set in ink
    const xf = lerp(xd0, xd1, C_OFF / DATA.cycle), wf = forcedW(tp), ba = lab(t0 + .6);
    const parts = [[xd0 + 1, xf - 2.5, 'forced vibration', wf], [xf + 2.5, xd1 - 1, 'free vibration', 1 - wf]];
    for (const [x0, x1, s, w] of parts) {
      brace(x0, x1, yd + 5, 7, { color: mixc(C.guide, C.ink, w), width: 1.2, alpha: ba });
      text(s, (x0 + x1) / 2, yd + 32, { size: 16, align: 'center', color: mixc(C.muted, C.ink, w), alpha: ba });
    }
  }
}

function draw() {
  const tp = tphys();
  row('res', 36, ['a', 'b'], ['standing waves in constructive form', 'standing waves over time'], 0, tp);
  row('off', 266, ['c', 'd'], ['non standing waves', 'non standing waves over time'], .06, tp);
  // the key, its five entries spread evenly over the width
  const la = lab(.8), LY = 508, SZ = 16;
  const keys = [['displacement, now', o => line([[o, LY - 5], [o + 26, LY - 5]], { color: C.blue, width: 2.4, alpha: la })],
                ['earlier', o => line([[o, LY - 5], [o + 26, LY - 5]], { color: C.mist, width: 1.6, alpha: la })],
                ['reflection, traveling left', o => line([[o, LY - 5], [o + 26, LY - 5]], { color: C.accent, width: 1.5, alpha: la })],
                ['nodes of the 3rd mode', o => node(o + 13, LY - 5, la)],
                ['drive envelope', o => line([[o, LY - 5], [o + 26, LY - 5]], { color: C.guide, width: 1.1, alpha: la })]];
  const ws = keys.map(([s]) => text(s, 0, -1e4, { size: SZ, alpha: 0 })), x0 = 40, x1 = 960;
  const gap = (x1 - x0 - ws.reduce((a, w) => a + w + 34, 0)) / (keys.length - 1);
  let kx = x0;
  keys.forEach(([s, sw], i) => { sw(kx); text(s, kx + 34, LY, { size: SZ, color: C.body, alpha: la }); kx += ws[i] + 34 + gap; });
  const pa = lab(.9);
  text('steel bar 40 × 10 mm, L = 1 m, pins at both ends; moment M(t) at the left pin, switched on, held, off; ζ = 0.05',
       18, H - 13, { size: 15, color: C.muted, alpha: pa });
  text(`shown ${SLOW} × slower`, W - 18, H - 13, { size: 15, color: C.muted, align: 'right', alpha: pa });
}
boot();
</script>
