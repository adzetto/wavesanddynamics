  <canvas id="c" role="img" aria-label="Computed transient of a simply supported beam driven by a moment at its left support, in forced vibration while the moment drives and in free vibration after it is switched off: at a frequency whose half wavelength fits the span, the reflected wave lines up with the outgoing wave and a standing wave with fixed nodes builds up; at a frequency that does not fit, the reflections cancel, the response stays small and its zero crossings wander."></canvas>
