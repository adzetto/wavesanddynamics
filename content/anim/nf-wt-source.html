    if (box) line(frame, { color: C.ink, width: 1.3, progress, alpha });
    else { line([[x, y + h], [x + w, y + h]], { color: C.ink, width: 1.3, progress, alpha }); line([[x, y + h], [x, y]], { color: C.ink, width: 1.3, progress, alpha }); }
    for (const v of xticks) {
      line([[X(v), y + h], [X(v), y + h - 5]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[X(v), y], [X(v), y + 5]], { color: C.ink, width: 1.1, alpha: a });
      math(xfmt(v), X(v), y + h + tickSize + 6, { size: tickSize, align: 'center', alpha: a });
    }
    for (const v of yticks) {
      line([[x, Y(v)], [x + 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      if (box) line([[x + w, Y(v)], [x + w - 5, Y(v)]], { color: C.ink, width: 1.1, alpha: a });
      math(yfmt(v), x - 8, Y(v) + tickSize * .35, { size: tickSize, align: 'right', alpha: a });
    }
    if (xlabel) math(xlabel, x + w / 2, y + h + tickSize + labelSize + 16, { size: labelSize, align: 'center', alpha: a });
    if (ylabel) math(ylabel, x - (o.ylabelGap || 48), y + h / 2, { size: labelSize, align: 'center', rot: -Math.PI / 2, alpha: a });
  }
  const inside = f => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); f(); ctx.restore(); };
  return { X, Y, inside };
}
function fmt(v) {
  if (Math.abs(v) < 1e-12) return '0';
  const s = Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toPrecision(3));
  return s.replace('-', '−');
}

/* ---------------------------------------------------------------- colour
   diverging(v), v in [-1, 1]: navy, white, the warm accent, for a signed
   field (displacement, pressure). seq(v), v in [0, 1]: white to navy. The
   LUTs, 256 entries of r, g, b, colour an ImageData without a call per pixel. */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function _ramp(stops) {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const u = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(u)), s = u - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(lerp(stops[k][c], stops[k + 1][c], s));
  }
  return lut;
}
/* blue and crimson arms matched stop for stop in CIELAB lightness (19, 43, 75),
   so a value and its negative weigh the same */
const DIVERGING = _ramp(['#043052', '#2E6A9E', '#9CBBD6', '#FFFFFF', '#DEABAB', '#B03F4D', '#651020'].map(_hex));
const SEQ = _ramp(['#FFFFFF', '#C9D7E4', '#5B8DB8', '#095A94', '#043052'].map(_hex));
function _lutc(lut, u) { const i = Math.round(clamp(u) * 255) * 3; return `rgb(${lut[i]},${lut[i + 1]},${lut[i + 2]})`; }
const diverging = v => _lutc(DIVERGING, (v + 1) / 2);
const seq = v => _lutc(SEQ, v);

/* ---------------------------------------------------------------- data
   b64f32(s): a Float32Array from base64, for arrays too long for JSON. */
function b64f32(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); }
function b64i8(s) { const b = atob(s), u = new Int8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = (b.charCodeAt(i) << 24) >> 24; return u; }

(() => {                                         // the pause and restart buttons, out of the way
  const s = document.createElement('style');      // until a pointer or the keyboard asks for them
  s.textContent = '.ctl{right:3px;bottom:3px;gap:3px;opacity:0}' +
    '.ctl button{width:24px;height:24px;font-size:10px}' +
    '@media (hover:hover){.fig:hover .ctl{opacity:1}}.ctl:focus-within{opacity:1}';
  document.head.appendChild(s);
})();

/* ---- the table's small figures (tools/numfig/wt_lib.py) ---- */
const SW = { axis: 5, struct: 7, data: 9, thin: 4.5, guide: 4 };
const DASH = [16, 13];
const TS = 58;                                   // type, the few labels there are
/* a TikZ primitive of the engine, drawn k times its size (strokes too) */
function big(x, y, k, f) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); f(); ctx.restore(); }
/* hatched ground, as TikZ draws it, from x0 to x1 at y: the line and the hatch below it */
function ground(x0, x1, y, o = {}) {
  const { alpha = 1, step = 26, len = 22, width = SW.thin } = o;
  line([[x0, y], [x1, y]], { color: C.ink, width, alpha });
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y, x1 - x0, len + 2); ctx.clip();
  for (let x = x0 - len; x < x1 + len; x += step)
    line([[x + len, y], [x, y + len]], { color: C.ink, width: width * .7, alpha });
  ctx.restore();
}
/* the share of a loop of period P that phase-shifted time s has reached */
const wrap = (s, P) => ((s % P) + P) % P;


const SC = 900 / DATA.view[0], OX = 50, OY = 20;
const XC = x => OX + x * SC, YC = y => OY + (DATA.view[1] - y) * SC;
const c = DATA.c, S = DATA.sens, SRC = DATA.src, TA = DATA.t;
const TMAX = Math.max(...TA);
const LOOP = 5.6;                                       // seconds on screen
const DISP = tau => tau * DATA.slow;                    // model time to screen time
const U0 = DISP(TMAX) + 1.55, POSTER_T = 0;             // t = 0 (and the still): every sensor heard, the branches drawn
function tri(x, y, r, fill, a) {                         // a sensor, as seismic maps draw one
  line([[x, y - r], [x + r * .9, y + r * .62], [x - r * .9, y + r * .62]], { color: C.navy, width: 3, fill, close: true, alpha: a });
}
function draw() {
  const u = wrap(U0 + t, LOOP);                         // screen time since the event
  const tau = u / DATA.slow;                             // model time since the event
  const aS = 1;
  const k = clamp(1 - (u - (LOOP - .45)) / .4);          // all but the plate fades before the next event
  // the plate: a region of a large one, steel, cut by the frame
  const px0 = XC(0), py0 = YC(DATA.view[1]), pw = DATA.view[0] * SC, ph = DATA.view[1] * SC;
  line([[px0, py0], [px0 + pw, py0], [px0 + pw, py0 + ph], [px0, py0 + ph]], { color: C.ink, width: SW.struct, fill: C.steel, close: true });
  ctx.save(); ctx.beginPath(); ctx.rect(px0, py0, pw, ph); ctx.clip();
  // the front: every point the wave has reached, |p - s| = c t
  const r = c * tau * SC, reach = Math.max(...S.map(p => Math.hypot(XC(p[0]) - XC(SRC[0]), YC(p[1]) - YC(SRC[1]))));
  if (u > 0 && r < reach + 60) {
    const af = k * clamp((reach + 60 - r) / 60) * clamp(r / 30);
    ctx.save(); ctx.globalAlpha *= af; ctx.strokeStyle = C.blue; ctx.lineWidth = SW.data;
    ctx.beginPath(); ctx.arc(XC(SRC[0]), YC(SRC[1]), r, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
  }
  // the branches, each drawn out from where it meets the source once both its sensors have heard it
  const hs = DISP(TMAX) + .15;
  DATA.hyp.forEach((h, i) => {
    const pts = []; for (let j = 0; j < h.p.length; j += 2) pts.push([XC(h.p[j]), YC(h.p[j + 1])]);
    if (u < hs + .12 * i) return;
    const a1 = pts.slice(0, h.k + 1).reverse(), a2 = pts.slice(h.k);
    const e = easeInOut(clamp((u - hs - .12 * i) / .45));
    line(a1, { color: C.navy, width: SW.thin, dash: DASH, progress: e, alpha: k });
    line(a2, { color: C.navy, width: SW.thin, dash: DASH, progress: e, alpha: k });
  });
  ctx.restore();                                          // the plate's clip
  // the source: the crack, and the point the branches agree on
  const pop = u > 0 ? Math.exp(-u / .5) : 0;
  const sa = Math.max(pop, clamp((u - hs - .5) / .3)) * k;
  if (sa > 0) {
    dot(XC(SRC[0]), YC(SRC[1]), 17, { color: '#781E2C', fill: C.accent, width: 3, alpha: sa });
    if (u > hs + .5) { const q = clamp((u - hs - .5) / .3); dot(XC(SRC[0]), YC(SRC[1]), 17 + 22 * easeOut(q), { color: C.accent, fill: null, width: 4, alpha: k * q * (1 - .4 * q) }); }
  }
  // the sensors: filled once the wave has reached them
  S.forEach((p, i) => {
    const heard = tau >= TA[i];
    const flash = heard ? Math.exp(-(tau - TA[i]) * DATA.slow / .35) : 0;
    tri(XC(p[0]), YC(p[1]), 26, heard ? C.navy : '#fff', aS);
    if (flash > .02) dot(XC(p[0]), YC(p[1]) + 3, 26 + 30 * (1 - flash), { color: C.navy, fill: null, width: 4, alpha: flash * aS });
  });
}
boot();
